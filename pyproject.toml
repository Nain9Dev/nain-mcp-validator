[project]
name = "nain-mcp-validator"
version = "0.1.0"
description = "Deterministic 3D asset validation and content integrity server for the Model Context Protocol (MCP)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aitor Nain Mendoza Vallejo", email = "contact@naindev.com" }
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
